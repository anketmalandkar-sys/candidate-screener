# Runs on `git commit` after `pre-commit install`. CI runs the same checks.
# Config for ruff/mypy lives in backend/pyproject.toml.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        # Type-check the whole package as a unit (module overrides in
        # pyproject.toml only apply when mypy sees real module paths).
        entry: bash -c 'cd backend && mypy app'
        pass_filenames: false
        files: ^backend/app/
        additional_dependencies:
          - pydantic==2.10.4
          - pydantic-settings==2.7.0
