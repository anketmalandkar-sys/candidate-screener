name: CI

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy app
      - name: pytest (no DB)
        run: pytest -m no_db

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: screener
          POSTGRES_PASSWORD: screener
          POSTGRES_DB: candidate_screener
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_SECRET_KEY: ci-only-secret-key-not-used-in-any-real-environment
      DATABASE_URL: postgresql+psycopg://screener:screener@localhost:5432/candidate_screener
      SCREENING_PROVIDER: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (full suite)
        # conftest.py rewrites DATABASE_URL to a sibling *_test database and
        # creates it on first run.
        run: pytest
